app = "market-radar"
primary_region = "ewr"

[env]
PORT = "10000"
RADAR_CACHE_DIR = "/data/cache"
APIFY_FB_MARKETPLACE_ACTOR = "datascrapers/facebook-marketplace"
MARKETPLACE_DEFAULT_LOCATION = "Atlantic City, New Jersey"
MARKET_RADAR_DEFAULT_LOCATION = "Atlantic City, New Jersey"
MARKETPLACE_ENABLE_SCHEDULER = "1"
MARKETPLACE_SCANNER_SCHEDULER = "1"
MARKETPLACE_ALLOW_FALLBACK = "0"
MARKETPLACE_PLANNER_INTERVAL_SECONDS = "60"
MARKETPLACE_JITTER_SECONDS = "5"
MARKETPLACE_STAGE2_MAX_PER_RUN = "0"
MARKETPLACE_MAX_ITEMS_DISCOVERY = "12"
DEALBRAIN_ALERT_DRY_RUN = "1"
DEALBRAIN_SCALE_LEVEL = "1"
DEALBRAIN_EBAY_SCHEDULER_ENABLED = "1"
PRICECHARTING_REFRESH_ENABLED = "0"
PRICECHARTING_REFRESH_HOUR = "6"
PRICECHARTING_STALE_HOURS = "96"
PRICECHARTING_FRESH_HOURS = "48"
LEVEL1_MAX_FB_RUNS_PER_DAY = "30"
LEVEL1_MAX_EBAY_CALLS_PER_DAY = "40"
LEVEL1_MAX_STAGE2_PER_DAY = "0"
LEVEL1_MAX_PROVIDER_DOLLARS_PER_DAY = "3"
FIRST_PROFIT_MODE = "1"
FIRST_PROFIT_LIVE = "1"
FIRST_PROFIT_ACTIVE_HAIRCUT = "0.15"
FIRST_PROFIT_APIFY_DAILY_CAP_USD = "0.50"
FIRST_PROFIT_MIN_PROFIT = "50"
MARKET_RADAR_MIN_PROFIT = "50"
MARKET_RADAR_STRONG_PROFIT = "50"
MARKET_RADAR_HOT_PROFIT = "75"
MARKET_RADAR_MONSTER_PROFIT = "125"
MARKET_RADAR_HOT_ROI_PCT = "40"
MARKET_RADAR_MONSTER_ROI_PCT = "60"

[[mounts]]
source = "market_radar_data"
destination = "/data"

[http_service]
internal_port = 10000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
interval = "15s"
timeout = "5s"
grace_period = "90s"
method = "GET"
path = "/health"

[[vm]]
memory = "1gb"
cpus = 1
memory_mb = 1024
