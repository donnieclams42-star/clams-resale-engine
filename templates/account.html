<!DOCTYPE html>
<html>

<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CLAMS Account</title>
<link rel="stylesheet" href="/static/styles.css">

<style>

.account-wrap{
max-width:1100px;
margin:auto;
padding:40px;
}

.account-header{
display:flex;
justify-content:space-between;
align-items:center;
gap:20px;
margin-bottom:30px;
flex-wrap:wrap;
}

.account-title h1{
margin:0 0 8px 0;
}

.account-title p{
margin:0;
opacity:.8;
}

.membership-pill{
display:inline-block;
padding:10px 16px;
border-radius:999px;
font-size:13px;
font-weight:800;
letter-spacing:.4px;
background:rgba(59,130,246,.18);
color:#93c5fd;
border:1px solid rgba(59,130,246,.35);
}

.account-grid{
display:grid;
grid-template-columns:repeat(2, 1fr);
gap:20px;
}

.account-card{
background:#0b244f;
padding:24px;
border-radius:14px;
box-shadow:0 0 10px rgba(0,0,0,.3);
}

.account-card h3{
margin-top:0;
margin-bottom:14px;
font-size:18px;
}

.account-row{
display:flex;
justify-content:space-between;
gap:20px;
padding:10px 0;
border-bottom:1px solid rgba(255,255,255,.08);
font-size:14px;
}

.account-row:last-child{
border-bottom:none;
padding-bottom:0;
}

.account-label{
opacity:.75;
}

.account-value{
font-weight:700;
text-align:right;
}

.mode-box{
margin-top:16px;
padding:16px;
border-radius:12px;
background:rgba(255,255,255,.04);
border:1px solid rgba(255,255,255,.08);
}

.mode-box h4{
margin:0 0 10px 0;
font-size:15px;
}

.mode-box p{
margin:0;
font-size:14px;
line-height:1.6;
opacity:.92;
}

.feature-list{
margin:12px 0 0 0;
padding-left:18px;
line-height:1.8;
font-size:14px;
}

.account-actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:18px;
}

.secondary-btn{
background:#1e40af;
}

.upgrade-box{
margin-top:16px;
padding:16px;
border-radius:12px;
background:rgba(168,85,247,.12);
border:1px solid rgba(168,85,247,.28);
}

@media (max-width:900px){
.account-grid{
grid-template-columns:1fr;
}
}

</style>
</head>

<body>

<div class="navbar">

<div class="nav-title">CLAMS</div>

<div class="nav-links">
<a href="/app?email={{email}}">Analyzer</a>
<a href="/settings?email={{email}}">Settings</a>
<a href="/account?email={{email}}">Account</a>
</div>

</div>

<div class="account-wrap">

<div class="account-header">
<div class="account-title">
<h1>Account Settings</h1>
<p>Manage your CLAMS membership, AI access, and default analyzer preferences.</p>
</div>

<div class="membership-pill">
{{ membership_tier }}
</div>
</div>

<div class="account-grid">

<div class="account-card">
<h3>Account Overview</h3>

<div class="account-row">
<div class="account-label">User</div>
<div class="account-value">{{ email }}</div>
</div>

<div class="account-row">
<div class="account-label">Membership</div>
<div class="account-value">{{ membership_tier }}</div>
</div>

<div class="account-row">
<div class="account-label">AI Access</div>
<div class="account-value">{{ ai_access }}</div>
</div>

<div class="account-row">
<div class="account-label">Status</div>
<div class="account-value">Active</div>
</div>

<div class="account-actions">
<a href="/app?email={{email}}"><button type="button">Back to Analyzer</button></a>
<a href="/login"><button type="button" class="secondary-btn">Logout</button></a>
</div>

</div>

</div>

</div>

</body>
</html>
